<style id="css">/* ---- reset ------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p, ol, ul, dl, dd, figure { margin: 0; }
ol, ul { padding: 0; list-style: none; }

/* ---- tokens: the light palette is the base ----------------------------- */
:root {
  --ground:      #eef0ec;
  --surface:     #ffffff;
  --raised:      #ffffff;
  --sunk:        #e8ebe6;
  --tint:        #f5f7f3;
  --ink:         #101613;
  --ink-2:       #3c4741;
  --muted:       #697570;
  --faint:       #9aa49e;
  --rule:        #dfe4de;
  --hair:        #ebeeea;
  --accent:      #0d6b4f;
  --accent-hi:   #0a5540;
  --accent-soft: #dff0e6;
  --accent-line: #0d6b4f;
  --flag:        #b04a2b;
  --flag-soft:   #fbe9e2;
  --term:        #bf9000;   /* the ochre the sheet uses for lead-in terms */
  --ring:        0 0 0 3px rgba(13, 107, 79, .16);
  --lift-1:      0 1px 2px rgba(16, 22, 19, .05), 0 1px 1px rgba(16, 22, 19, .04);
  --lift-2:      0 2px 6px rgba(16, 22, 19, .06), 0 10px 24px -12px rgba(16, 22, 19, .18);
  --lift-3:      0 4px 10px rgba(16, 22, 19, .08), 0 26px 60px -28px rgba(16, 22, 19, .42);
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  --r-s: 9px;
  --r-m: 13px;
  --r-l: 18px;
  --rail-w: 30px;
  --list-w: 348px;
  --top-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #0a0f0c;
    --surface:     #141a17;
    --raised:      #1a221e;
    --sunk:        #101613;
    --tint:        #131a16;
    --ink:         #e9efeb;
    --ink-2:       #bcc7c1;
    --muted:       #8b9a93;
    --faint:       #667770;
    --rule:        #26302b;
    --hair:        #1c2420;
    --accent:      #52c396;
    --accent-hi:   #7cdcb6;
    --accent-soft: #163126;
    --accent-line: #52c396;
    --flag:        #e0906f;
    --flag-soft:   #2c1d17;
    --term:        #d9a520;
    --ring:        0 0 0 3px rgba(82, 195, 150, .2);
    --lift-1:      0 1px 2px rgba(0, 0, 0, .5);
    --lift-2:      0 2px 6px rgba(0, 0, 0, .5), 0 10px 24px -12px rgba(0, 0, 0, .7);
    --lift-3:      0 4px 10px rgba(0, 0, 0, .6), 0 26px 60px -28px rgba(0, 0, 0, .95);
  }
}
:root[data-theme="dark"] {
  --ground:      #0a0f0c;
  --surface:     #141a17;
  --raised:      #1a221e;
  --sunk:        #101613;
  --tint:        #131a16;
  --ink:         #e9efeb;
  --ink-2:       #bcc7c1;
  --muted:       #8b9a93;
  --faint:       #667770;
  --rule:        #26302b;
  --hair:        #1c2420;
  --accent:      #52c396;
  --accent-hi:   #7cdcb6;
  --accent-soft: #163126;
  --accent-line: #52c396;
  --flag:        #e0906f;
  --flag-soft:   #2c1d17;
  --term:        #d9a520;
  --ring:        0 0 0 3px rgba(82, 195, 150, .2);
  --lift-1:      0 1px 2px rgba(0, 0, 0, .5);
  --lift-2:      0 2px 6px rgba(0, 0, 0, .5), 0 10px 24px -12px rgba(0, 0, 0, .7);
  --lift-3:      0 4px 10px rgba(0, 0, 0, .6), 0 26px 60px -28px rgba(0, 0, 0, .95);
}

/* ---- page --------------------------------------------------------------- */
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#app { height: 100%; display: flex; flex-direction: column; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); color: var(--accent-hi); }

/* ---- top bar ------------------------------------------------------------ */
.top {
  flex: none;
  display: flex; align-items: center; gap: 14px;
  height: var(--top-h); padding: 0 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand .mark {
  font-family: var(--serif); font-size: 22px; font-weight: 700;
  font-variation-settings: "opsz" 36;
  letter-spacing: -.022em; white-space: nowrap;
}

/* two views, shown as a segmented control rather than a switch */
.tabs {
  display: flex; gap: 2px; flex: none;
  padding: 3px; border-radius: var(--r-m); background: var(--sunk);
}
.tab {
  border: 0; background: none; cursor: pointer;
  padding: 6px 15px; border-radius: 10px;
  font-size: 13.5px; font-weight: 500; color: var(--muted);
  transition: background .14s ease, color .14s ease, box-shadow .14s ease;
}
.tab[hidden] { display: none; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] {
  background: var(--surface); color: var(--ink);
  box-shadow: var(--lift-1); font-weight: 600;
}

.search { position: relative; flex: 1; max-width: 620px; margin: 0 auto; }
.search input {
  width: 100%; height: 40px; padding: 0 66px 0 38px;
  border: 1px solid transparent; border-radius: var(--r-m);
  background: var(--sunk); color: var(--ink);
  font-size: 14.5px;
  transition: background .14s ease, border-color .14s ease, box-shadow .14s ease;
}
.search input::placeholder { color: var(--faint); }
.search input::-webkit-search-cancel-button { display: none; }
.search input:hover { background: var(--hair); }
.search input:focus {
  outline: none; background: var(--surface);
  border-color: var(--accent); box-shadow: var(--ring);
}
.search .glass {
  position: absolute; left: 13px; top: 13px;
  width: 15px; height: 15px; color: var(--faint); pointer-events: none;
}
.search .hintkeys { position: absolute; right: 10px; top: 10px; display: flex; gap: 3px; pointer-events: none; }
.search kbd {
  font-family: var(--mono); font-size: 10px; color: var(--faint);
  border: 1px solid var(--rule); border-radius: 5px; padding: 2px 6px;
  background: var(--surface);
}
.search input:not(:placeholder-shown) ~ .hintkeys { display: none; }

.acts { display: flex; align-items: center; gap: 8px; flex: none; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--rule); background: var(--surface);
  color: var(--ink); cursor: pointer;
  padding: 8px 14px; border-radius: var(--r-s);
  font-size: 13.5px; font-weight: 500; white-space: nowrap;
  box-shadow: var(--lift-1);
  transition: background .14s ease, border-color .14s ease, box-shadow .14s ease, transform .1s ease;
}
.btn:hover { background: var(--tint); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--accent); border-color: transparent; color: #f2fbf6;
  box-shadow: var(--lift-2);
}
:root[data-theme="dark"] .btn-primary { color: #05130d; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .btn-primary { color: #05130d; }
}
.btn-primary:hover { background: var(--accent-hi); border-color: transparent; }
.btn-quiet { border-color: transparent; background: none; color: var(--muted); box-shadow: none; }
.btn-quiet:hover { color: var(--ink); background: var(--sunk); border-color: transparent; }
.btn[disabled] { opacity: .4; cursor: default; box-shadow: none; }
.btn[hidden] { display: none; }

.iconbtn {
  border: 1px solid var(--rule); background: var(--surface); cursor: pointer;
  width: 32px; height: 30px; border-radius: var(--r-s); color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; line-height: 1; box-shadow: var(--lift-1);
  transition: color .14s ease, border-color .14s ease, background .14s ease;
}
.iconbtn:hover { color: var(--ink); border-color: var(--muted); background: var(--tint); }
.iconbtn[disabled] { opacity: .3; cursor: default; box-shadow: none; }

/* ---- notice bar --------------------------------------------------------- */
.banner {
  flex: none;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 11px 18px;
  background: var(--flag-soft); color: var(--ink);
  border-bottom: 1px solid var(--rule); font-size: 13px;
}
.banner[hidden] { display: none; }

/* ---- workspace: letter rail | result list | detail pane ----------------- */
.work {
  flex: 1; min-height: 0; display: grid;
  grid-template-columns: var(--rail-w) var(--list-w) 7px 1fr;
}
/* Folded, only two children are left in the grid, so the template has to
   describe two tracks — leaving four would drop the detail pane into a
   zero-width column and take the page with it. */
body[data-list="off"] .work { grid-template-columns: 7px 1fr; }
body[data-list="off"] .alpha, body[data-list="off"] .list { display: none; }
body.resizing { cursor: col-resize; user-select: none; }

/* the divider: drag it, or fold the list away with the chevron */
.resizer {
  position: relative; cursor: col-resize;
  background: var(--rule);
  transition: background .14s ease;
}
.resizer:hover, body.resizing .resizer { background: var(--accent); }
.resizer:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.fold {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  width: 20px; height: 34px; padding: 0;
  border: 1px solid var(--rule); border-radius: 7px;
  background: var(--surface); color: var(--muted);
  font-size: 14px; line-height: 1; cursor: pointer; z-index: 12;
  box-shadow: var(--lift-1);
}
.fold:hover { color: var(--ink); border-color: var(--muted); }
@media (max-width: 760px) { .resizer { display: none; } }

.alpha {
  display: flex; flex-direction: column; align-items: stretch;
  padding: 8px 3px; gap: 1px;
  background: var(--ground); overflow: hidden;
}
.alpha button {
  flex: 1 1 0; min-height: 0;
  border: 0; background: none; cursor: pointer;
  font-family: var(--mono); font-size: 9.5px; font-weight: 500;
  color: var(--faint); text-transform: uppercase;
  border-radius: 5px;
  transition: color .1s ease, background .1s ease;
}
.alpha button:hover { color: var(--accent-hi); background: var(--accent-soft); }
.alpha button[aria-current="true"] { color: #f2fbf6; background: var(--accent); font-weight: 600; }
:root[data-theme="dark"] .alpha button[aria-current="true"] { color: #05130d; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .alpha button[aria-current="true"] { color: #05130d; }
}
.alpha button[disabled] { color: var(--hair); cursor: default; }
.alpha button[disabled]:hover { background: none; color: var(--hair); }

.list {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--surface); border-left: 1px solid var(--rule); border-right: 1px solid var(--rule);
}

/* chips wrap onto as many lines as they need — clipping them made the ones
   past the fold impossible to reach */
.chips {
  flex: none; display: flex; flex-wrap: wrap; gap: 6px;
  padding: 12px 14px; border-bottom: 1px solid var(--hair);
}
.chips[hidden] { display: none; }
.chip {
  border: 1px solid var(--rule); background: var(--surface); cursor: pointer;
  border-radius: 999px; padding: 5px 11px; white-space: nowrap;
  font-size: 12px; color: var(--muted); font-weight: 500;
  transition: color .12s ease, background .12s ease, border-color .12s ease;
}
.chip:hover { color: var(--ink); border-color: var(--muted); background: var(--tint); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: transparent; color: #f2fbf6; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { color: #05130d; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #05130d; }
}
.chip .n {
  font-family: var(--mono); font-size: 10px; margin-left: 5px;
  font-variant-numeric: tabular-nums; opacity: .7;
}
.count {
  flex: none; padding: 9px 16px;
  font-family: var(--mono); font-size: 10.5px; color: var(--faint);
  font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  border-bottom: 1px solid var(--hair);
  display: flex; align-items: center; gap: 8px;
}
.count .dot { color: var(--rule); }

.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; position: relative; }
.spacer { position: relative; width: 100%; }
.window { position: absolute; left: 0; right: 0; top: 0; }

.hit {
  display: block; width: 100%; text-align: left;
  border: 0; border-bottom: 1px solid var(--hair);
  background: none; cursor: pointer;
  padding: 10px 16px 11px; height: 64px;
  overflow: hidden; position: relative;
}
.hit::before {
  content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px;
  border-radius: 0 3px 3px 0; background: transparent;
}
.hit:hover { background: var(--tint); }
.hit[aria-current="true"] { background: var(--accent-soft); }
.hit[aria-current="true"]::before { background: var(--accent-line); }
.hit .top-line { display: flex; align-items: baseline; gap: 7px; }
.hit .hw {
  font-family: var(--serif); font-size: 16.5px; font-weight: 600;
  font-variation-settings: "opsz" 24; letter-spacing: -.008em;
  color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hit .pos { font-family: var(--serif); font-style: italic; font-size: 12.5px; color: var(--faint); flex: none; }
.hit .senses-n {
  margin-left: auto; flex: none;
  font-family: var(--mono); font-size: 9.5px; color: var(--muted);
  background: var(--sunk); border-radius: 999px; padding: 2px 7px;
}
.hit .gloss {
  display: block; margin-top: 3px;
  font-size: 13px; color: var(--ink-2); line-height: 1.4;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hit .mine-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--flag); flex: none; }

/* a passage row leads with its number, so the titles line up down the column */
.hit.passage { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; }
.hit .idx {
  font-family: var(--mono); font-size: 12.5px; color: var(--faint);
  font-variant-numeric: tabular-nums; text-align: right; padding-top: 3px;
}
.hit[aria-current="true"] .idx { color: var(--accent-hi); }
.hit.passage .col { min-width: 0; }
.hit.passage .hw { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.letter-mark {
  height: 28px; display: flex; align-items: center;
  padding: 0 16px; background: var(--tint);
  border-bottom: 1px solid var(--hair);
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .18em; color: var(--muted); text-transform: uppercase;
}
.empty { padding: 32px 18px; color: var(--muted); font-size: 13px; }
.empty .btn { margin-top: 14px; }

/* ---- detail pane -------------------------------------------------------- */
.detail { overflow-y: auto; min-width: 0; background: var(--ground); }
.detail-inner { padding: 34px 44px 96px; max-width: 1240px; margin: 0 auto; }
/* a passage is given the whole column — capped only so the lines do not run
   away on a very large screen */
.detail-inner.wide { max-width: 1400px; }
.detail-inner.wide .read { max-width: none; }
.entry { max-width: 62ch; }

.entry-nav { display: flex; align-items: center; gap: 7px; margin-bottom: 28px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.entry-nav .pos-in-list { font-variant-numeric: tabular-nums; }
.entry-nav .grow { flex: 1; }

.entry-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 9px 13px; }
.headword {
  font-family: var(--serif); font-weight: 700;
  font-size: clamp(32px, 4.6vw, 50px); line-height: 1.04;
  font-variation-settings: "opsz" 130;
  letter-spacing: -.032em; text-wrap: balance;
}
.pos-big { font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--muted); }
.ipa {
  font-family: var(--mono); font-size: 13.5px; color: var(--accent-hi);
  background: var(--accent-soft); border-radius: 999px; padding: 3px 10px;
}
.kind {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
  border: 1px solid var(--rule); border-radius: 999px; padding: 3px 9px;
}
.kind-mine { color: var(--flag); border-color: var(--flag); }
.kind-sheet { color: var(--accent-hi); border-color: var(--accent); }
.note { margin-top: 13px; font-size: 13px; color: var(--muted); font-style: italic; }

.senses {
  margin-top: 28px; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--r-l); overflow: hidden;
}
.sense { display: grid; grid-template-columns: 34px 1fr; padding: 18px 20px; }
.sense + .sense { border-top: 1px solid var(--hair); }
.sense .num {
  font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--accent);
  padding-top: 4px; font-variant-numeric: tabular-nums;
}
.sense .body { grid-column: 2; }
.sense.solo { grid-template-columns: 1fr; }
.sense.solo .body { grid-column: 1; }
.def { font-size: 16px; line-height: 1.6; color: var(--ink); }
.def .term { font-weight: 600; color: var(--term); }
.vi { margin-top: 10px; padding-left: 13px; border-left: 2px solid var(--accent-line); font-size: 15px; color: var(--ink-2); font-weight: 450; }
.egs { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.eg { font-size: 13.5px; color: var(--muted); font-style: italic; line-height: 1.55; padding-left: 13px; border-left: 1px solid var(--rule); }

.related { margin-top: 32px; }
.related h2, .blank h3 {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--faint); font-weight: 500;
}
.related ul { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.related button {
  border: 1px solid var(--rule); background: var(--surface); cursor: pointer;
  border-radius: 999px; padding: 6px 13px; font-size: 13.5px; box-shadow: var(--lift-1);
}
.related button:hover { border-color: var(--accent); color: var(--accent-hi); background: var(--tint); }
.related button .pos { font-family: var(--serif); font-style: italic; color: var(--faint); font-size: 11.5px; margin-left: 5px; }

/* options menu — destructive actions kept out of arm's reach */
.menu-wrap { position: relative; display: inline-flex; }
.menu {
  position: absolute; top: calc(100% + 7px); right: 0; z-index: 40;
  min-width: 196px; padding: 6px;
  background: var(--raised); border: 1px solid var(--rule);
  border-radius: var(--r-m); box-shadow: var(--lift-3);
  display: flex; flex-direction: column; gap: 2px;
}
.menu[hidden] { display: none; }
.menu-item {
  border: 0; background: none; cursor: pointer;
  text-align: left; padding: 8px 11px; border-radius: var(--r-s);
  font-size: 13.5px; color: var(--ink); white-space: nowrap;
  text-decoration: none; display: block;
}
.menu-item:hover { background: var(--sunk); }
.menu-item.danger { color: var(--flag); }
.menu-item.danger:hover { background: var(--flag-soft); }
.menu-sep { height: 1px; background: var(--hair); margin: 4px 2px; }

/* ---- opening screen ----------------------------------------------------- */
.blank { max-width: 64ch; }
.blank .lead {
  font-family: var(--serif); font-size: clamp(28px, 3.6vw, 40px); font-weight: 600;
  font-variation-settings: "opsz" 90; letter-spacing: -.026em; line-height: 1.1;
  text-wrap: balance;
}
.blank .sub { margin-top: 15px; font-size: 15px; color: var(--muted); line-height: 1.65; }
.stats {
  margin-top: 30px; display: flex; flex-wrap: wrap; gap: 0;
  border: 1px solid var(--rule); border-radius: var(--r-l); overflow: hidden;
  background: var(--surface); box-shadow: var(--lift-1);
}
.stat { flex: 1 1 130px; padding: 16px 18px; border-right: 1px solid var(--hair); }
.stat:last-child { border-right: 0; }
.stat b {
  display: block; font-family: var(--mono); font-size: 22px; font-weight: 600;
  font-variant-numeric: tabular-nums; letter-spacing: -.04em; color: var(--ink);
}
.stat span { display: block; margin-top: 3px; font-size: 11px; color: var(--faint); letter-spacing: .05em; text-transform: uppercase; }
.blank .keys { margin-top: 32px; }
.blank dl { margin-top: 13px; display: grid; grid-template-columns: auto 1fr; gap: 9px 18px; align-items: baseline; }
.blank dt { font-family: var(--mono); font-size: 11px; display: flex; gap: 3px; }
.blank dt span { border: 1px solid var(--rule); border-radius: 6px; padding: 2px 7px; background: var(--surface); color: var(--muted); }
.blank dd { font-size: 13.5px; color: var(--muted); }
.blank .foot { margin-top: 30px; display: flex; gap: 9px; flex-wrap: wrap; }
.blank .local-note { margin-top: 24px; font-size: 12.5px; color: var(--faint); line-height: 1.6; }

/* ---- reading passages --------------------------------------------------- */
.read { max-width: 68ch; min-width: 0; }

.read h1 {
  font-family: var(--serif); font-size: clamp(27px, 3.6vw, 38px); font-weight: 600;
  line-height: 1.14; letter-spacing: -.024em;
  font-variation-settings: "opsz" 90; text-wrap: balance;
}
.read .meta { margin-top: 12px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: .09em; text-transform: uppercase; }
.read .hint {
  margin-top: 18px; padding: 11px 14px; border-radius: var(--r-m);
  background: var(--accent-soft); color: var(--accent-hi); font-size: 12.5px;
}
/* Adding a book: one button where the kind-chips sit in the dictionary, and a
   line beside it that says what is happening — reading a 300-page PDF takes
   long enough that silence would read as nothing happening. */
.shelf-add { display: flex; align-items: center; gap: 10px; padding: 0 0 10px; flex-wrap: wrap; }
.chip.add { cursor: pointer; }
.chip.add:disabled { opacity: .5; cursor: default; }
.shelf-pub {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10.5px; color: var(--faint);
  cursor: pointer; user-select: none;
}
.shelf-pub input { accent-color: var(--accent-hi); margin: 0; cursor: pointer; }
.shelf-msg { font-family: var(--mono); font-size: 10.5px; color: var(--faint); min-width: 0; }
.shelf-msg.warn { color: var(--term); }
.shelf-msg.good { color: var(--accent-hi); }
.shelf-msg.bad { color: var(--flag); }

/* A book's table of contents: a chapter is a row you press, and the rows have
   to stay readable at sixty of them, so they are quieter than a search hit. */
.toc { margin-top: 24px; display: flex; flex-direction: column; }
.toc-row {
  display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: baseline;
  width: 100%; padding: 11px 10px; border: 0; border-radius: var(--r-s);
  background: none; text-align: left; cursor: pointer;
  border-bottom: 1px solid var(--rule);
}
.toc-row:last-child { border-bottom: 0; }
.toc-row:hover { background: var(--accent-soft); }
.toc-row .idx { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.toc-row .hw { font-family: var(--serif); font-size: 16px; color: var(--ink); min-width: 0; }
.toc-row .gloss { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; }

.read .prose { margin-top: 26px; display: flex; flex-direction: column; gap: 18px; }
.read .prose p {
  position: relative;
  font-size: 17px; line-height: 1.78; color: var(--ink-2);
  /* justified, with hyphenation so the word spacing does not gape */
  text-align: justify; text-justify: inter-word;
  hyphens: auto; -webkit-hyphens: auto;
}
.read .prose p::selection, .read .prose ::selection { background: var(--accent-soft); }
/* lettered paragraphs, as the IELTS-style passages are written */
.read .prose p.labelled { padding-left: 32px; }
.read .prose .pmark {
  position: absolute; left: 0; top: 4px;
  font-family: var(--mono); font-size: 11.5px; font-weight: 600;
  color: var(--accent); letter-spacing: .04em;
}

/* the little card that opens over a selection */
.lookup {
  position: fixed; z-index: 60; width: min(340px, calc(100vw - 24px));
  background: var(--raised); border: 1px solid var(--rule);
  border-radius: var(--r-m); box-shadow: var(--lift-3);
  padding: 13px 15px 14px;
}
.lookup[hidden] { display: none; }
.lookup .picked {
  font-family: var(--serif); font-size: 19px; font-weight: 600;
  font-variation-settings: "opsz" 30; letter-spacing: -.01em;
  padding-right: 22px; word-break: break-word;
}
.lookup .sub { margin-top: 2px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.lookup .sub .ipa-inline { color: var(--accent-hi); }
.lookup .glosses { margin-top: 11px; display: flex; flex-direction: column; gap: 8px; }
.lookup .g { font-size: 14px; color: var(--ink); line-height: 1.5; }
.lookup .g em { color: var(--muted); font-style: normal; font-size: 12.5px; display: block; margin-top: 2px; }
.lookup .none { margin-top: 9px; font-size: 13px; color: var(--muted); line-height: 1.55; }
.lookup .row { margin-top: 13px; display: flex; gap: 7px; flex-wrap: wrap; }
.lookup .row .btn { padding: 6px 11px; font-size: 12.5px; }
.lookup .x {
  position: absolute; top: 9px; right: 9px;
  border: 0; background: none; cursor: pointer; color: var(--faint);
  width: 22px; height: 22px; border-radius: 6px; line-height: 1; font-size: 15px;
}
.lookup .x:hover { background: var(--sunk); color: var(--ink); }

mark { background: var(--accent-soft); color: var(--accent-hi); border-radius: 3px; padding: 0 2px; }

/* ---- loading screen ----------------------------------------------------- */
.loading { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; color: var(--muted); font-size: 13.5px; }
.loading .bar { width: 200px; height: 3px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.loading .bar i { display: block; height: 100%; width: 40%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }

/* ---- dialogs ------------------------------------------------------------ */
dialog {
  border: 1px solid var(--rule); border-radius: var(--r-l);
  background: var(--surface); color: var(--ink);
  padding: 0; width: min(660px, 94vw); box-shadow: var(--lift-3);
}
dialog::backdrop { background: rgba(8, 14, 11, .5); backdrop-filter: blur(2px); }
.dlg-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--rule); display: flex; align-items: baseline; gap: 10px; }
.dlg-head h2 { font-family: var(--serif); font-size: 22px; font-weight: 600; font-variation-settings: "opsz" 40; }
.dlg-head p { font-size: 12.5px; color: var(--faint); }
.dlg-body { padding: 20px 24px; max-height: 62vh; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.dlg-x {
  margin-left: auto; align-self: flex-start;
  border: 0; background: none; cursor: pointer; color: var(--faint);
  width: 28px; height: 28px; border-radius: 8px; font-size: 19px; line-height: 1;
}
.dlg-x:hover { background: var(--sunk); color: var(--ink); }
.dlg-foot { padding: 15px 24px; border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; }
.dlg-foot .spacer2 { margin-left: auto; }
.dlg-msg { font-size: 12.5px; color: var(--flag); }
.dlg-msg.good { color: var(--accent-hi); }
.dlg-msg.warn { color: var(--term); }

.grid-3 { display: grid; grid-template-columns: 2fr 1fr 1.4fr; gap: 13px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.field input, .field select, .field textarea {
  border: 1px solid var(--rule); border-radius: var(--r-s);
  background: var(--tint); color: var(--ink);
  padding: 9px 11px; font-size: 14px; width: 100%;
  transition: border-color .14s ease, box-shadow .14s ease, background .14s ease;
}
.field textarea { resize: vertical; min-height: 64px; line-height: 1.5; font-family: var(--sans); }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--accent); box-shadow: var(--ring); background: var(--surface);
}
.field input.mono { font-family: var(--mono); font-size: 12.5px; }
.field .hint { font-size: 11.5px; color: var(--faint); line-height: 1.45; }
.sense-edit { border: 1px solid var(--rule); border-radius: var(--r-m); padding: 15px; display: flex; flex-direction: column; gap: 13px; background: var(--tint); }
.sense-edit .row { display: flex; align-items: center; gap: 8px; }
.sense-edit .row .lab { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-hi); }
.sense-edit .row .drop { margin-left: auto; }

.set-note { font-size: 12.5px; color: var(--muted); line-height: 1.6; padding: 13px 15px; border-radius: var(--r-m); background: var(--tint); border: 1px solid var(--hair); }
.gate { border: 1px solid var(--rule); border-radius: var(--r-m); padding: 15px; background: var(--tint); display: flex; flex-direction: column; gap: 8px; }
.gate-title { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--flag); font-weight: 600; }
.gate-title.good { color: var(--accent-hi); }
.gate-sub { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.gate-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.gate-row input {
  flex: 1 1 160px; min-width: 0;
  border: 1px solid var(--rule); border-radius: var(--r-s);
  background: var(--surface); color: var(--ink);
  padding: 8px 11px; font-size: 14px; letter-spacing: .08em;
}
.gate-row input:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }

/* the sheet and the steps for changing it, folded away until wanted */
.setfold { border: 1px solid var(--rule); border-radius: var(--r-m); background: var(--tint); }
.setfold[open] { background: var(--surface); }
.setfold > summary { list-style: none; cursor: pointer; padding: 13px 15px; display: flex; align-items: center; gap: 9px; }
.setfold > summary::-webkit-details-marker { display: none; }
.setfold > summary::before { content: "▸"; color: var(--faint); font-size: 11px; line-height: 1; }
.setfold[open] > summary::before { content: "▾"; }
.setfold > summary:hover .setfold-title { color: var(--accent); }
.setfold-title { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-hi); font-weight: 600; }
.setfold-state { margin-left: auto; font-size: 11.5px; color: var(--faint); font-style: italic; }
.setfold-body { padding: 14px 15px 15px; border-top: 1px solid var(--hair); display: flex; flex-direction: column; gap: 13px; }
.setfold-lede { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.setfold-note { font-size: 11.5px; color: var(--faint); line-height: 1.55; }
/* the reset takes list markers away, so the numbers are drawn back on */
.steps { margin: 0; padding: 0; counter-reset: step; display: flex; flex-direction: column; gap: 9px; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.steps > li { counter-increment: step; display: flex; align-items: flex-start; gap: 9px; }
.steps > li::before {
  content: counter(step);
  flex: none; width: 18px; height: 18px; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: var(--accent-soft); color: var(--accent-hi);
  font-family: var(--mono); font-size: 10px; font-weight: 600;
}
.setfold .setgroup { margin-top: 2px; }
.setfold.sub { background: var(--tint); }
.setfold.sub[open] { background: var(--tint); }
.setfold.sub > summary { padding: 10px 13px; }
.setfold.sub .setfold-title { color: var(--muted); }
.setfold.sub .setfold-body { padding: 12px 13px 13px; }
.setfold.sub .setfold-state { font-style: normal; font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; }
.filelink { font-family: var(--mono); font-size: 11.5px; color: var(--accent-hi); }
a.filelink { text-decoration: underline; text-underline-offset: 2px; }

.setgroup { display: flex; flex-direction: column; gap: 15px; }
.setgroup.disabled { opacity: .5; }
.setrow { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.setlabel { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.setline { display: flex; align-items: center; gap: 9px; min-width: 0; }
.setval {
  flex: 1; min-width: 0;
  font-family: var(--mono); font-size: 12.5px; color: var(--ink);
  padding: 9px 11px; border-radius: var(--r-s);
  background: var(--tint); border: 1px solid var(--hair);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.setval.unset { color: var(--faint); font-style: italic; }
.setline input { flex: 1; min-width: 0; }
.edit-btn { flex: none; }
.checkrow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.checkrow[hidden] { display: none; }
.checkrow input { accent-color: var(--accent); width: 15px; height: 15px; }
a.btn { text-decoration: none; }
a.btn[hidden] { display: none; }

/* ---- toast -------------------------------------------------------------- */
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  background: var(--ink); color: var(--ground);
  padding: 10px 18px; border-radius: 999px; font-size: 13px;
  box-shadow: var(--lift-3); z-index: 70;
}
.toast[hidden] { display: none; }

/* ---- narrow screens ----------------------------------------------------- */
.back { display: none; }
@media (max-width: 1000px) {
  :root { --list-w: 300px; }
  .detail-inner { padding: 28px 28px 72px; }
}
@media (max-width: 760px) {
  .work { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .alpha {
    flex-direction: row; padding: 4px; gap: 1px;
    border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none;
  }
  .alpha::-webkit-scrollbar { display: none; }
  .alpha button { flex: 0 0 28px; height: 30px; }
  .top { flex-wrap: wrap; height: auto; padding: 11px 14px; gap: 10px; }
  .brand { order: 1; }
  .acts { order: 2; margin-left: auto; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .list { border-left: 0; border-right: 0; }
  .detail-inner { padding: 26px 18px 72px; }
  body[data-view="detail"] .list, body[data-view="detail"] .alpha { display: none; }
  body[data-view="detail"] .back { display: inline-flex; }
  body:not([data-view="detail"]) .detail { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---- the floating dictionary, for use while reading --------------------- */
.popdict {
  position: fixed; right: 26px; top: 96px; z-index: 65;
  width: min(360px, calc(100vw - 24px));
  max-height: min(560px, calc(100vh - 130px));
  display: flex; flex-direction: column;
  background: var(--raised); border: 1px solid var(--rule);
  border-radius: var(--r-m); box-shadow: var(--lift-3);
  overflow: hidden;
}
.popdict[hidden] { display: none; }
.pd-head {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 10px 10px 10px 14px; cursor: move;
  background: var(--tint); border-bottom: 1px solid var(--rule);
}
.pd-title {
  flex: 1; font-family: var(--mono); font-size: 9.5px;
  letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
}
.pd-x {
  border: 0; background: none; cursor: pointer; color: var(--faint);
  width: 22px; height: 22px; border-radius: 6px; font-size: 16px; line-height: 1;
}
.pd-x:hover { background: var(--sunk); color: var(--ink); }
.pd-search { flex: none; padding: 11px 12px; border-bottom: 1px solid var(--hair); }
.pd-search input {
  width: 100%; height: 34px; padding: 0 11px;
  border: 1px solid var(--rule); border-radius: var(--r-s);
  background: var(--tint); color: var(--ink); font-size: 14px;
}
.pd-search input:focus {
  outline: none; border-color: var(--accent); box-shadow: var(--ring); background: var(--surface);
}
.pd-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.pd-note { padding: 18px 14px; font-size: 12.5px; color: var(--faint); line-height: 1.55; }

.pd-hits { display: flex; flex-direction: column; }
.pd-hits li + li { border-top: 1px solid var(--hair); }
.pd-hit { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: 9px 14px; }
.pd-hit:hover { background: var(--tint); }
.pd-w {
  font-family: var(--serif); font-size: 15px; font-weight: 600;
  font-variation-settings: "opsz" 24; color: var(--ink);
  display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pd-w i { font-style: italic; font-size: 11.5px; color: var(--faint); margin-left: 5px; font-weight: 400; }
.pd-vi { display: block; margin-top: 1px; font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.pd-back {
  border: 0; background: none; cursor: pointer; color: var(--muted);
  font-family: var(--mono); font-size: 10.5px; padding: 10px 14px 4px;
}
.pd-back:hover { color: var(--ink); }
.pd-entry { padding: 4px 14px 16px; }
.pd-head-word { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.pd-hw { font-family: var(--serif); font-size: 22px; font-weight: 700; font-variation-settings: "opsz" 40; letter-spacing: -.02em; }
.pd-pos { font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--muted); }
.pd-ipa { font-family: var(--mono); font-size: 11.5px; color: var(--accent-hi); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; }
.pd-sense { display: grid; grid-template-columns: 20px 1fr; gap: 0 4px; margin-top: 13px; }
.pd-sense.solo { grid-template-columns: 1fr; }
.pd-sense .pd-num { font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: var(--accent); padding-top: 3px; }
.pd-sense .def { font-size: 13.5px; line-height: 1.55; }
.pd-sense .vi { margin-top: 6px; padding-left: 10px; font-size: 13px; }
.pd-entry .btn { margin-top: 16px; width: 100%; justify-content: center; }

@media (max-width: 760px) {
  .popdict { right: 8px; left: 8px; top: auto; bottom: 8px; width: auto; max-height: 60vh; }
}

/* ---- the installed copy ------------------------------------------------- */
/* iPhones put a home indicator across the bottom and, in landscape, a notch
   down one side. env() is zero everywhere else, so these are free. */
@media (max-width: 760px) {
  .top { padding-top: calc(11px + env(safe-area-inset-top)); }
  .toast { bottom: calc(28px + env(safe-area-inset-bottom)); }
  .work { padding-bottom: env(safe-area-inset-bottom); }
}

/* iOS offers no install button of its own, so the page has to say where it is */
.a2hs {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 14px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2);
  background: var(--accent-soft); border-bottom: 1px solid var(--rule);
}
.a2hs[hidden] { display: none; }
.a2hs b { font-weight: 600; }
.a2hs .x {
  margin-left: auto; flex: none; border: 0; background: none; cursor: pointer;
  color: var(--muted); font-size: 16px; line-height: 1; padding: 0 2px;
}

(function () {

  var BACKUP_KEY = "engrowdict:added:v1";

  var READINGS = [];

  var SHELF_NET = [];        // what the site publishes
  var SHELF_MINE = [];       // what was added on this device
  var bookText = {};         // slug -> the whole book, once it has been opened
  var entries = [];
